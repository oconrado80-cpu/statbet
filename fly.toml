# Alternativa a Render: Fly.io (región Bogotá). Se usa con: fly launch --no-deploy --copy-config  y luego  fly deploy
app = "statbet-oscar"
primary_region = "bog"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/statbet.db"
  TRUST_PROXY = "1"
  BACKFILL_DAYS = "30"

[[mounts]]
  source = "statbet_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
